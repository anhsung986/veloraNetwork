<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velora Network - Cổng Cộng Đồng Minecraft</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #2ecc71; /* Màu xanh lá Minecraft */
            --primary-hover: #27ae60;
            --discord-color: #5865F2;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(rgba(15, 23, 42, 0.8), rgba(15, 23, 42, 0.95)), 
                        url('https://images.unsplash.com/photo-1627856013091-fed6e4e30025?q=80&w=1920') no-repeat center center/cover;
        }

        .gateway-card {
            background-color: var(--card-bg);
            padding: 45px 35px;
            border-radius: 20px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
        }

        .logo-icon {
            font-size: 3.5rem;
            color: var(--primary-color);
            margin-bottom: 15px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .gateway-card h1 {
            font-size: 2rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: 1.5px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .gateway-card p.subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 30px;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: none;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.25s ease;
            box-sizing: border-box;
        }

        .btn-login {
            background-color: var(--primary-color);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.35);
        }

        .btn-login:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(46, 204, 113, 0.5);
        }

        .btn-register {
            background-color: transparent;
            color: var(--text-light);
            border: 2px solid #334155;
        }

        .btn-register:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
            transform: translateY(-2px);
            background-color: rgba(46, 204, 113, 0.05);
        }

        .btn-discord {
            background-color: var(--discord-color);
            color: #ffffff;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(88, 101, 242, 0.3);
        }

        .btn-discord:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(88, 101, 242, 0.45);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0 10px;
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .divider::before, .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #334155;
        }

        .divider span {
            padding: 0 10px;
        }

        footer {
            margin-top: 25px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="gateway-card">
    <div class="logo-icon">
        <i class="fa-solid fa-cube"></i>
    </div>
    <h1>Velora Network</h1>
    <p class="subtitle">Chào mừng bạn đến với máy chủ Minecraft</p>

    <div class="btn-container">
        <!-- Nút Đăng Nhập -->
        <a href="login.html" class="btn btn-login">
            <i class="fa-solid fa-right-to-bracket"></i> Đăng Nhập
        </a>

        <!-- Nút Đăng Ký -->
        <a href="login.html?mode=register" class="btn btn-register">
            <i class="fa-solid fa-user-plus"></i> Tạo Tài Khoản Mới
        </a>

        <div class="divider">
            <span>CỘNG ĐỒNG</span>
        </div>

        <!-- Link Discord -->
        <a href="https://discord.gg/YOUR_DISCORD_CODE" target="_blank" class="btn btn-discord">
            <i class="fa-brands fa-discord"></i> Tham gia Discord
        </a>
    </div>

    <footer>
        <p>&copy; Velora Network. Not an official Minecraft product.</p>
    </footer>
</div>

<!-- Tự động kiểm tra đăng nhập từ Firebase -->
<script type="module">
    import { auth, onAuthStateChanged } from './firebase-config.js';

    // Kiểm tra xem người dùng đã đăng nhập chưa
    onAuthStateChanged(auth, (user) => {
        if (user) {
            // Nếu đã đăng nhập thì tự động chuyển sang trang cài đặt/quản lý tài khoản
            window.location.href = "home.html";
        }
    });
</script>

</body>
  </html>
