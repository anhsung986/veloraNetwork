<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velora Network - Cài Đặt Tài Khoản</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #2ecc71;
            --primary-hover: #27ae60;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --input-bg: #0f172a;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --danger-color: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
        }

        /* Navbar */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 8%;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--primary-color);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .btn-nav {
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            text-decoration: none;
            font-size: 0.85rem;
            transition: 0.2s;
            cursor: pointer;
            border: none;
        }

        .btn-home {
            background-color: #334155;
            color: var(--text-light);
        }

        .btn-home:hover {
            background-color: #475569;
        }

        .btn-logout {
            background-color: var(--danger-color);
            color: white;
        }

        .btn-logout:hover {
            background-color: #dc2626;
        }

        /* Main Container */
        .container {
            max-width: 800px;
            margin: 110px auto 40px;
            padding: 0 20px;
        }

        .page-header {
            margin-bottom: 30px;
        }

        .page-header h1 {
            font-size: 1.8rem;
            font-weight: 800;
        }

        .page-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Settings Card */
        .settings-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--primary-color);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 12px;
        }

        /* Profile Preview Section */
        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .avatar-box {
            position: relative;
            width: 80px;
            height: 80px;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 12px;
            border: 2px solid var(--primary-color);
            background-color: #0f172a;
            object-fit: cover;
        }

        .profile-info h3 {
            font-size: 1.3rem;
            font-weight: 700;
        }

        .profile-info p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.88rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-light);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 15px;
            color: var(--text-muted);
        }

        .form-input {
            width: 100%;
            padding: 12px 15px 12px 45px;
            background-color: var(--input-bg);
            border: 1px solid #334155;
            border-radius: 8px;
            color: var(--text-light);
            font-size: 0.95rem;
            outline: none;
            transition: 0.2s;
        }

        .form-input:focus {
            border-color: var(--primary-color);
        }

        .form-input:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-save {
            background-color: var(--primary-color);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-save:hover {
            background-color: var(--primary-hover);
        }

        /* Toast Popup Alert */
        .toast-msg {
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 20px;
            display: none;
        }

        .toast-success {
            background-color: rgba(46, 204, 113, 0.15);
            color: #2ecc71;
            border: 1px solid rgba(46, 204, 113, 0.3);
        }

        .toast-error {
            background-color: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <a href="home.html" class="logo">
            <i class="fa-solid fa-cube"></i> VELORA NETWORK
        </a>
        <div class="nav-links">
            <a href="home.html" class="btn-nav btn-home">
                <i class="fa-solid fa-house"></i> Trang Chủ
            </a>
            <button id="logout-btn" class="btn-nav btn-logout">
                <i class="fa-solid fa-right-from-bracket"></i> Đăng Xuất
            </button>
        </div>
    </header>

    <!-- Content Area -->
    <div class="container">

        <div class="page-header">
            <h1>Cài Đặt Tài Khoản</h1>
            <p>Quản lý thông tin cá nhân và tài khoản Minecraft của bạn tại đây.</p>
        </div>

        <!-- Notification Message Box -->
        <div id="toast-msg" class="toast-msg"></div>

        <!-- Section 1: Minecraft Profile -->
        <div class="settings-card">
            <div class="card-title">
                <i class="fa-solid fa-gamepad"></i> Hồ Sơ Minecraft
            </div>

            <div class="profile-header">
                <div class="avatar-box">
                    <img id="profile-avatar" class="avatar-img" src="https://mc-heads.net/avatar/MSTEVE" alt="Minecraft Head">
                </div>
                <div class="profile-info">
                    <h3 id="display-ign">Steve</h3>
                    <p id="display-email">email@example.com</p>
                </div>
            </div>

            <form id="ign-form">
                <div class="form-group">
                    <label for="mc-username">Tên Trong Game (In-Game Name - IGN)</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="mc-username" class="form-input" placeholder="Ví dụ: AnhSung986" required>
                    </div>
                </div>

                <button type="submit" class="btn-save">
                    <i class="fa-solid fa-floppy-disk"></i> Lưu Thay Đổi IGN
                </button>
            </form>
        </div>

        <!-- Section 2: Account Security -->
        <div class="settings-card">
            <div class="card-title">
                <i class="fa-solid fa-shield-halved"></i> Bảo Mật Tài Khoản
            </div>

            <form id="password-form">
                <div class="form-group">
                    <label for="email-address">Địa Chỉ Email</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="email-address" class="form-input" disabled>
                    </div>
                </div>

                <div class="form-group">
                    <label for="new-password">Mật Khẩu Mới</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="new-password" class="form-input" placeholder="Nhập mật khẩu mới (ít nhất 6 ký tự)" minlength="6">
                    </div>
                </div>

                <button type="submit" class="btn-save">
                    <i class="fa-solid fa-key"></i> Đổi Mật Khẩu
                </button>
            </form>
        </div>

    </div>

    <!-- Firebase Modular SDK Script -->
    <script type="module">
        import { 
            auth, 
            db, 
            onAuthStateChanged, 
            signOut, 
            ref, 
            get, 
            set, 
            updatePassword 
        } from './firebase-config.js';

        const toast = document.getElementById('toast-msg');
        let currentUser = null;

        // Hàm hiển thị thông báo
        function showMessage(msg, isSuccess = true) {
            toast.innerText = msg;
            toast.className = `toast-msg ${isSuccess ? 'toast-success' : 'toast-error'}`;
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 3500);
        }

        // Kiểm tra xem người dùng đã đăng nhập chưa
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('email-address').value = user.email;
                document.getElementById('display-email').innerText = user.email;

                // Tải dữ liệu người dùng từ Firebase Realtime Database
                try {
                    const userRef = ref(db, `users/${user.uid}`);
                    const snapshot = await get(userRef);
                    if (snapshot.exists()) {
                        const data = snapshot.val();
                        if (data.mcUsername) {
                            document.getElementById('mc-username').value = data.mcUsername;
                            document.getElementById('display-ign').innerText = data.mcUsername;
                            // Cập nhật Avatar Head Minecraft
                            document.getElementById('profile-avatar').src = `https://mc-heads.net/avatar/${data.mcUsername}`;
                        }
                    }
                } catch (err) {
                    console.error("Lỗi khi tải thông tin tài khoản:", err);
                }
            } else {
                // Chưa đăng nhập -> Chuyển về trang login
                window.location.href = "login.html";
            }
        });

        // 1. Xử lý Cập nhật Tên Minecraft (IGN)
        document.getElementById('ign-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const ign = document.getElementById('mc-username').value.trim();

            if (!ign || !currentUser) return;

            try {
                const avatarUrl = `https://mc-heads.net/avatar/${ign}`;
                
                // Lưu thông tin vào Realtime Database
                await set(ref(db, `users/${currentUser.uid}`), {
                    email: currentUser.email,
                    mcUsername: ign,
                    avatar: avatarUrl,
                    updatedAt: new Date().toISOString()
                });

                // Cập nhật giao diện
                document.getElementById('display-ign').innerText = ign;
                document.getElementById('profile-avatar').src = avatarUrl;
                
                showMessage("Đã cập nhật tên Minecraft thành công!");
            } catch (error) {
                console.error(error);
                showMessage("Không thể cập nhật IGN. Vui lòng thử lại sau!", false);
            }
        });

        // 2. Xử lý Đổi Mật Khẩu
        document.getElementById('password-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('new-password').value;

            if (!newPassword) {
                showMessage("Vui lòng nhập mật khẩu mới!", false);
                return;
            }

            try {
                await updatePassword(currentUser, newPassword);
                showMessage("Đã đổi mật khẩu thành công!");
                document.getElementById('new-password').value = "";
            } catch (error) {
                console.error(error);
                if (error.code === 'auth/requires-recent-login') {
                    showMessage("Vì lý do bảo mật, bạn cần đăng xuất và đăng nhập lại trước khi đổi mật khẩu!", false);
                } else {
                    showMessage("Lỗi đổi mật khẩu: " + error.message, false);
                }
            }
        });

        // 3. Xử lý Đăng xuất
        document.getElementById('logout-btn').addEventListener('click', () => {
            signOut(auth).then(() => {
                window.location.href = "login.html";
            });
        });
    </script>
</body>
                      </html>
